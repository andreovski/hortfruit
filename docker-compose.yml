services:
  postgres:
    # Mesma versão maior de produção (docs/deploy/railway.md).
    image: postgres:17-alpine
    container_name: hortifruit_db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hortifruit
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
